<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Communication Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- SENTENCE STRIP -->
    <header id="strip-area">
      <button id="strip" type="button" aria-label="Speak the sentence">
        <span id="strip-words"></span>
      </button>
      <button id="delete-last" class="control" type="button">Delete<br>last word</button>
      <button id="clear" class="control" type="button">Clear</button>
    </header>

    <!-- MAIN AREA: Home + previous arrow | grid | staff + next arrow -->
    <main id="main-area">
      <div id="left-rail" class="rail">
        <button id="home" class="control" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 4 24h6v18h11V30h6v12h11V24h6z"/></svg>
          <span>Home</span>
        </button>
        <button id="prev" class="arrow control" type="button" aria-label="Previous page">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M32 6 10 24l22 18z"/></svg>
        </button>
      </div>

      <div id="grid" class="grid"></div>

      <div id="right-rail" class="rail">
        <div class="staff-corner">
          <button id="staff" type="button" aria-label="Staff settings. Press and hold for 3 seconds.">Staff</button>
          <!-- Only shown when speech is muted. Not a button. -->
          <div id="mute-indicator" hidden>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 18h8l10-8v28l-10-8H6z"/><path d="M32 18l10 12M42 18L32 30" stroke="#000" stroke-width="4" stroke-linecap="round" fill="none"/></svg>
            <span>Sound off</span>
          </div>
        </div>
        <button id="next" class="arrow control" type="button" aria-label="Next page">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 6l22 18-22 18z"/></svg>
        </button>
      </div>
    </main>

    <!-- FIXED BAR -->
    <footer id="fixed-bar"></footer>
  </div>

  <!-- Shown if the iPad is held upright -->
  <div id="rotate-message">Please turn the iPad sideways.</div>

  <!-- ADULT CHECK (not security – just stops accidental access) -->
  <div id="adult-check" class="modal" hidden>
    <div class="modal-box">
      <h2>Staff check</h2>
      <p id="adult-question" class="question"></p>
      <p id="adult-entry" class="entry" aria-live="polite"></p>
      <p id="adult-message" class="message"></p>
      <div id="keypad" class="keypad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="del">Delete</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="ok">OK</button>
      </div>
      <button id="adult-cancel" type="button" class="wide">Cancel</button>
    </div>
  </div>

  <!-- STAFF SETTINGS -->
  <div id="settings" class="modal" hidden>
    <div class="modal-box settings-box">
      <h2>Staff settings</h2>

      <section>
        <h3>Buttons per screen</h3>
        <div class="choice-row">
          <button type="button" class="choice" data-grid="8">8</button>
          <button type="button" class="choice" data-grid="12">12</button>
        </div>
      </section>

      <section>
        <h3>Display</h3>
        <div class="choice-row">
          <button type="button" class="choice" data-theme-choice="light">Light</button>
          <button type="button" class="choice" data-theme-choice="dark">Dark</button>
        </div>
      </section>

      <section>
        <h3>Speech</h3>
        <div class="choice-row">
          <button type="button" class="choice" data-muted="false">Speech on</button>
          <button type="button" class="choice" data-muted="true">Speech off (muted)</button>
        </div>
      </section>

      <section>
        <h3><label for="voice-select">Voice</label></h3>
        <select id="voice-select"></select>
      </section>

      <section>
        <h3><label for="rate">Speaking speed: <span id="rate-value"></span></label></h3>
        <input id="rate" type="range" min="0.5" max="1.5" step="0.05">
        <button id="test-voice" type="button" class="wide">Test voice</button>
      </section>

      <section>
        <h3><label for="delay">Double-press protection: <span id="delay-value"></span></label></h3>
        <input id="delay" type="range" min="0" max="3000" step="250">
      </section>

      <section>
        <h3>Show keys in the bottom bar</h3>
        <div id="fixed-toggles" class="toggle-grid"></div>
      </section>

      <section>
        <h3>My words</h3>
        <p class="hint">Words you add are saved on this iPad only.</p>
        <button id="add-word" type="button" class="wide">+ Add a word</button>
        <div id="my-words" class="my-words"></div>
      </section>

      <div class="settings-actions">
        <button id="reset-settings" type="button">Reset to defaults</button>
        <button id="close-settings" type="button" class="primary">Done</button>
      </div>
    </div>
  </div>

  <!-- ADD / EDIT A WORD -->
  <div id="word-editor" class="modal" hidden>
    <div class="modal-box settings-box">
      <h2 id="we-title">Add a word</h2>

      <section>
        <h3><label for="we-label">Word on the button</label></h3>
        <input id="we-label" type="text" maxlength="30" autocomplete="off" autocapitalize="none" spellcheck="false">
      </section>

      <section>
        <h3><label for="we-speak">Say it as (optional)</label></h3>
        <p class="hint">Only fill this in if the iPad says the word wrongly.</p>
        <input id="we-speak" type="text" maxlength="60" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button id="we-listen" type="button" class="wide">Listen</button>
      </section>

      <section>
        <h3>Colour</h3>
        <div id="we-colours" class="swatches"></div>
      </section>

      <section>
        <h3><label for="we-screen">Page</label></h3>
        <select id="we-screen"></select>
      </section>

      <section>
        <h3>Picture</h3>
        <div class="picture-row">
          <div id="we-preview" class="picture-preview"></div>
          <div class="picture-buttons">
            <label class="file-button">Take or choose photo
              <input id="we-photo" type="file" accept="image/*">
            </label>
            <button id="we-pick-symbol" type="button">Choose a symbol</button>
            <button id="we-no-picture" type="button">No picture</button>
          </div>
        </div>
        <div id="we-symbols" class="symbol-picker" hidden></div>
      </section>

      <p id="we-message" class="message"></p>

      <div class="settings-actions">
        <button id="we-delete" type="button">Delete word</button>
        <button id="we-cancel" type="button">Cancel</button>
        <button id="we-save" type="button" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script src="data/board.js"></script>
  <script src="app.js"></script>
</body>
</html>
